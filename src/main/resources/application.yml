spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/project_soeun
    username: soeun
    password: soeun_pw

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
